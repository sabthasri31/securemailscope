<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecureMailScope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12232e; --muted:#5b6b75; --paper:#f1f4f1; --card:#ffffff; --line:#d7dfdb;
  --teal:#0b7a75; --crit:#b42318; --high:#d9640f; --med:#b08a0a; --low:#2f7d57;
  --head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{--ink:#e6eeea; --muted:#9db0a8; --paper:#0f1a1f; --card:#16252c; --line:#264049; --teal:#3cc4bb; --crit:#ff7b6e; --high:#ffa25c; --med:#e5c34a; --low:#6fd39d;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--body)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--line);background:var(--card)}
.brand{font:700 22px var(--head);letter-spacing:-.01em}
.brand small{display:block;font:400 12px var(--body);color:var(--muted);letter-spacing:0}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
@media (prefers-color-scheme: dark){.btn.primary{color:#062c2a}}
main{max-width:1200px;margin:0 auto;padding:24px 28px 60px}
.banner{font-size:13px;color:var(--muted);margin:0 0 18px}
.hero{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:28px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px}
.dial{position:relative;width:240px;height:240px;margin:auto}
.dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.dial .grade{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.dial .grade b{font:700 96px/1 var(--head)}
.dial .grade span{color:var(--muted);font-size:14px}
.dists{display:grid;gap:18px}
.dist h3{margin:0 0 6px;font:600 14px var(--body)}
.bar{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:13px;color:var(--muted)}
.legend em{font-style:normal;display:inline-flex;align-items:center;gap:5px}
.legend em::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stat b{display:block;font:700 26px var(--head)}
.stat span{font-size:13px;color:var(--muted)}
h2{font:700 19px var(--head);margin:32px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px}
.finding{display:grid;grid-template-columns:96px 1fr 70px;gap:14px;padding:14px 18px;border-top:1px solid var(--line)}
.finding:first-child{border-top:0}
.finding p{margin:2px 0;color:var(--muted);font-size:14px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1.5px solid var(--c);color:var(--c);height:fit-content;text-align:center}
.critical{--c:var(--crit)} .high{--c:var(--high)} .medium{--c:var(--med)} .low{--c:var(--low)}
.count{font:700 22px var(--head);text-align:right}
.two{display:grid;grid-template-columns:minmax(260px,1fr) 2fr;gap:20px}
.srv{padding:10px 16px;border-top:1px solid var(--line);font-size:14px}
.srv:first-child{border-top:0}
.srv .meter{height:8px;border-radius:4px;background:var(--line);margin-top:4px}
.srv .meter i{display:block;height:100%;border-radius:4px;background:var(--c)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.toolbar input,.toolbar select{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:6px 9px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);border-top:0}
tbody tr{cursor:pointer}
tbody tr:hover{background:color-mix(in srgb,var(--teal) 8%,transparent)}
.mono{font-family:var(--mono);font-size:13px}
.score{font-weight:600}
/* drawer */
#drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,100%);background:var(--card);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.12);transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;padding:22px;z-index:10}
#drawer.open{transform:none}
#drawer h3{font:700 18px var(--head);margin:22px 0 8px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:4px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.tx{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px;font:12.5px/1.6 var(--mono);overflow-x:auto}
.tx div{white-space:nowrap}
.tx .tls{color:var(--teal)}
.tx .warn{color:var(--crit)}
.close{float:right}
.empty{padding:22px;color:var(--muted)}
@media (max-width:820px){.hero,.two{grid-template-columns:1fr}.finding{grid-template-columns:1fr}.count{text-align:left}}
@media print{header .actions,#drawer,.toolbar{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand">SecureMailScope<small>Cryptographic posture of SMTP / IMAP / POP3 traffic</small></div>
  <div class="actions">
    <label class="btn primary" style="cursor:pointer">Upload PCAP<input id="pcap" type="file" accept=".pcap,.pcapng,.cap" hidden></label>
    <button class="btn" id="resim">New simulation</button>
    <a class="btn" href="/api/report.json" download>JSON</a>
    <a class="btn" href="/api/report.html" download>HTML</a>
    <button class="btn" onclick="window.print()">PDF</button>
  </div>
</header>

<main>
  <p class="banner" id="banner">Loading...</p>

  <section class="hero" aria-label="Security posture">
    <div class="dial">
      <svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="var(--line)" stroke-width="10"/>
        <circle id="ring" cx="60" cy="60" r="52" fill="none" stroke="var(--teal)" stroke-width="10" stroke-linecap="round" stroke-dasharray="326.7" stroke-dashoffset="326.7"/></svg>
      <div class="grade"><b id="grade">-</b><span id="pscore">posture score</span></div>
    </div>
    <div class="dists" id="dists"></div>
  </section>

  <section class="stats" id="stats"></section>

  <h2>Fix first</h2>
  <section class="card" id="findings"></section>

  <h2>Servers and sessions</h2>
  <div class="two">
    <section class="card" id="servers"></section>
    <section class="card">
      <div class="toolbar">
        <input id="q" type="search" placeholder="Search server, client or ID" aria-label="Search sessions">
        <select id="fproto" aria-label="Protocol"><option value="">All protocols</option><option>SMTP</option><option>IMAP</option><option>POP3</option></select>
        <select id="flevel" aria-label="Risk level"><option value="">All risk levels</option><option>critical</option><option>high</option><option>medium</option><option>low</option></select>
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>ID</th><th>Server</th><th>Proto</th><th>TLS</th><th>Risk</th><th>Anomaly</th></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
    </section>
  </div>
</main>

<aside id="drawer" aria-label="Session detail" aria-hidden="true"></aside>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COL = {critical:'var(--crit)',high:'var(--high)',medium:'var(--med)',low:'var(--low)'};
const PAL = ['#0b7a75','#5b8def','#b08a0a','#8a5bd6','#d9640f','#b42318'];
const api = (u,o) => fetch(u,o).then(r => r.json());

function dist(title, obj, colorFn){
  const tot = Object.values(obj).reduce((a,b)=>a+b,0) || 1;
  const keys = Object.keys(obj);
  return `<div class="dist"><h3>${title}</h3><div class="bar">${keys.map((k,i)=>`<i title="${esc(k)}: ${obj[k]}" style="width:${obj[k]/tot*100}%;background:${colorFn(k,i)}"></i>`).join('')}</div>
  <div class="legend">${keys.map((k,i)=>`<em style="--c:${colorFn(k,i)}">${esc(k)} ${obj[k]}</em>`).join('')}</div></div>`;
}

async function loadSummary(){
  const s = await api('/api/summary');
  $('#banner').textContent = `Source: ${s.source}. ${s.total} mail sessions analysed. Demo mode: PCAP parsing is simulated; scoring, ML and reports are live.`;
  $('#grade').textContent = s.grade;
  $('#pscore').textContent = `${s.posture_score} / 100`;
  $('#ring').style.transition = 'stroke-dashoffset .9s ease';
  $('#ring').style.strokeDashoffset = 326.7 * (1 - s.posture_score/100);
  const verCol = {'TLSv1.3':'#2f7d57','TLSv1.2':'#0b7a75','TLSv1.1':'#b08a0a','TLSv1.0':'#d9640f','SSLv3':'#b42318','Cleartext':'#b42318'};
  $('#dists').innerHTML =
    dist('Risk level', s.by_level, k => COL[k]) +
    dist('TLS version negotiated', s.by_version, k => verCol[k]||'#888') +
    dist('Protocol', s.by_protocol, (k,i) => PAL[i]) +
    dist('Transport', s.by_mode, (k,i) => k==='Cleartext' ? '#b42318' : PAL[i]);
  const st = s.starttls;
  $('#stats').innerHTML = [
    [s.fs_pct + '%','TLS sessions with forward secrecy'],
    [`${st.upgraded} / ${st.offered}`,'STARTTLS offered vs. upgraded'],
    [st.stripped,'Suspected STARTTLS stripping'],
    [s.cert_issues,'Sessions with certificate problems'],
    [s.anomalies,'Anomalous TLS sessions'],
    [s.tls13_hidden_certs,'TLS 1.3 sessions (cert encrypted)']
  ].map(([b,l]) => `<div class="stat"><b>${b}</b><span>${l}</span></div>`).join('');
  $('#findings').innerHTML = s.top_findings.length ? s.top_findings.map(f => `
    <div class="finding"><span class="chip ${f.severity}">${f.severity}</span>
      <div><strong>${esc(f.title)}</strong><p>${esc(f.fix)}</p><p>Affects: ${f.servers.map(esc).join(', ')}</p></div>
      <div class="count">${f.count}<br><span style="font:400 12px var(--body);color:var(--muted)">sessions</span></div></div>`).join('')
    : '<div class="empty">No findings.</div>';
  $('#servers').innerHTML = s.servers.map(x => {
    const lvl = x.avg_risk>=70?'critical':x.avg_risk>=45?'high':x.avg_risk>=20?'medium':'low';
    return `<div class="srv" style="--c:${COL[lvl]}"><div style="display:flex;justify-content:space-between"><span class="mono">${esc(x.host)}</span><span class="score">${x.avg_risk}</span></div>
    <div class="meter"><i style="width:${x.avg_risk}%"></i></div><small style="color:var(--muted)">${x.sessions} sessions, worst ${x.max_risk}</small></div>`;
  }).join('');
}

async function loadRows(){
  const p = new URLSearchParams({q:$('#q').value, protocol:$('#fproto').value, level:$('#flevel').value});
  const rows = await api('/api/sessions?' + p);
  $('#rows').innerHTML = rows.length ? rows.map(s => `
    <tr tabindex="0" data-id="${s.id}"><td class="mono">${s.id}</td><td>${esc(s.server)}</td><td>${s.protocol}/${s.port}</td>
    <td>${s.tls ? esc(s.tls.version) : '<span class="chip critical">cleartext</span>'}</td>
    <td><span class="chip ${s.risk_level}">${s.risk_level}</span> <span class="score">${s.risk_score}</span></td>
    <td>${s.anomaly ? '<span class="chip medium">yes ' + s.anomaly_score + '</span>' : '-'}</td></tr>`).join('')
    : '<tr><td colspan="6" class="empty">No sessions match these filters.</td></tr>';
}

async function openSession(id){
  const s = await api('/api/sessions/' + id);
  const t = s.tls, c = s.cert;
  const kv = o => `<dl class="kv">${Object.entries(o).map(([k,v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
  $('#drawer').innerHTML = `
    <button class="btn close" id="closeD">Close</button>
    <h3 style="margin-top:0">${s.id} <span class="chip ${s.risk_level}">${s.risk_level} ${s.risk_score}</span></h3>
    ${kv({Client:s.client, Server:`${s.server} (${s.server_ip})`, Protocol:`${s.protocol} on port ${s.port} (${s.mode})`,
      STARTTLS: s.mode==='STARTTLS' ? (s.starttls_stripped?'stripped from capabilities':s.starttls_used?'offered and upgraded':s.starttls_offered?'offered, not used':'not offered') : 'n/a (implicit TLS)',
      'Rule score':s.rule_score, 'ML risk score':`${s.ai_score} (${s.ai_level}, confidence ${s.ai_confidence})`, 'Anomaly score':s.anomaly_score})}
    <h3>Negotiated TLS</h3>
    ${t ? kv({Version:t.version, Cipher:t.cipher, 'Key exchange':t.kex, Encryption:t.enc, 'Forward secrecy':t.fs?'yes':'no', 'Client max version':t.client_max}) : '<p class="empty" style="padding:0">No TLS: session was cleartext.</p>'}
    <h3>Certificate</h3>
    ${c ? kv({Subject:c.subject, Issuer:c.issuer, Signature:c.sig_alg, 'Public key':`${c.key_alg} ${c.key_bits} bit`, 'Expires':`${c.not_after} (${c.days_left} days)`, 'Self-signed':c.self_signed?'yes':'no', 'Chain valid':c.chain_valid?'yes':'no', 'Hostname match':c.san_match?'yes':'no'})
        : `<p class="empty" style="padding:0">${t ? 'Encrypted in TLS 1.3: cannot be read passively.' : 'No TLS.'}</p>`}
    <h3>Findings</h3>
    ${s.findings.length ? s.findings.map(f => `<p><span class="chip ${f.severity}">${f.severity}</span> <strong>${esc(f.title)}</strong><br><span style="color:var(--muted)">${esc(f.detail)}</span><br>Fix: ${esc(f.fix)}</p>`).join('') : '<p>No issues found.</p>'}
    <h3>Reconstructed stream</h3>
    <div class="tx">${s.transcript.map(e => `<div class="${e.layer==='TLS'?'tls':''} ${/CLEARTEXT|no STARTTLS/.test(e.text)?'warn':''}">${String(e.t).padStart(4)}ms ${e.dir} [${e.layer}] ${esc(e.text)}</div>`).join('')}</div>`;
  const d = $('#drawer'); d.classList.add('open'); d.setAttribute('aria-hidden','false');
  $('#closeD').onclick = closeDrawer; $('#closeD').focus();
}
function closeDrawer(){ const d=$('#drawer'); d.classList.remove('open'); d.setAttribute('aria-hidden','true'); }

async function refresh(){ await Promise.all([loadSummary(), loadRows()]); }

$('#rows').addEventListener('click', e => { const tr = e.target.closest('tr[data-id]'); if(tr) openSession(tr.dataset.id); });
$('#rows').addEventListener('keydown', e => { if(e.key==='Enter'){ const tr = e.target.closest('tr[data-id]'); if(tr) openSession(tr.dataset.id); }});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeDrawer(); });
['q','fproto','flevel'].forEach(id => $('#'+id).addEventListener('input', loadRows));
$('#resim').onclick = async () => { await api('/api/simulate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({n:90})}); closeDrawer(); refresh(); };
$('#pcap').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  const fd = new FormData(); fd.append('file', f);
  $('#banner').textContent = 'Analysing ' + f.name + '...';
  const r = await api('/api/upload',{method:'POST',body:fd});
  closeDrawer(); await refresh();
  if(r && r.pcap_magic_valid === false) $('#banner').textContent += ' (file does not look like a PCAP; simulated anyway)';
};
refresh();
</script>
</body>
</html>
